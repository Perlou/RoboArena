[project]
name = "roboarena"
version = "0.1.0"
description = "机器人策略评测平台：神经仿真器 + 评测 + 看板 + 遥操作"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
]

[project.scripts]
roboarena = "roboarena.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行宽交给格式化器；中文长字符串不强行折行

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
