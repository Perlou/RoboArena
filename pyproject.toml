[project]
name = "roboarena"
version = "0.1.0"
description = "机器人策略评测平台：神经仿真器 + 评测 + 看板 + 遥操作"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
    # PushT 任务的真实仿真器。它声明依赖 pygame 和带界面的 opencv-python，见下面 [tool.uv]
    "gym-pusht>=0.1.8",
    "pygame-ce>=2.5",
    "opencv-python-headless>=4.9",
    # 读取 LeRobot 格式的人类演示（parquet + mp4），不安装 lerobot 本体
    "pyarrow>=18",
    "imageio[ffmpeg]>=2.34",
    "httpx>=0.29.0",
]

[project.scripts]
roboarena = "roboarena.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.380"]

[tool.uv]
# gym-pusht 声明依赖 pygame 与 opencv-python：前者与 pygame-ce 装进同一个目录互相覆盖，
# 后者自带一份 SDL2。两者都排除，改用 pygame-ce 与 headless 版 OpenCV（API 兼容）。
override-dependencies = [
    "pygame ; sys_platform == 'never'",
    "opencv-python ; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行宽交给格式化器；中文长字符串不强行折行

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
